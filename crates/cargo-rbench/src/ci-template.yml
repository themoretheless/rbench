name: rbench smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Template assumes this rbench workspace. For another repository, install a pinned CLI first.
      - run: cargo install --path crates/cargo-rbench --locked
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo rbench accept --seed 7 -o .rbench/accept.json
      - run: cargo rbench doctor
      # Shared hosted runners give smoke evidence, not controlled regression evidence.
      # Add 'cargo rbench gate RUN --config budgets.json' for project-specific absolute budgets,
      # including throughput minima (Direction::Higher / budget.min).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbench-results
          path: .rbench
          include-hidden-files: true
          if-no-files-found: warn
