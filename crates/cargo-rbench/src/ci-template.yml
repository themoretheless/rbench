name: rbench smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Template assumes this rbench workspace. For another repository, install a pinned CLI first.
      - run: cargo install --path crates/cargo-rbench --locked
      - run: cargo rbench bench --repetitions 3 -o .rbench/ci -- --profile quick
      - name: Offline reports
        shell: bash
        run: |
          for run in .rbench/ci/*/run.json; do
            cargo rbench report "$run" -o "${run%/run.json}/report.html"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rbench-results
          path: .rbench/ci
          include-hidden-files: true
          if-no-files-found: warn
      # Shared hosted runners give smoke evidence, not controlled regression evidence.
      # Add 'cargo rbench gate RUN --config budgets.json' for project-specific absolute budgets.
