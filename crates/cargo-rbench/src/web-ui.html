<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>rbench — отчёты</title>
<style>
:root{font:15px system-ui;color:#182536;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#17263b;color:white;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}header small{color:#a9bdd7}main{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 85px)}aside{padding:22px;border-right:1px solid #dce3ec;background:white}input,select,button,a.action{font:inherit;padding:10px;border:1px solid #c8d4e2;border-radius:7px}input,select{width:100%;background:white}button,a.action{cursor:pointer;background:#fff;color:#164a80;text-decoration:none}button:hover,a.action:hover{background:#edf4fd}label{display:block;margin:18px 0 7px;font-size:13px;color:#52647a}#runs{list-style:none;padding:0;max-height:60vh;overflow:auto}#runs button{width:100%;text-align:left;margin-bottom:7px;overflow-wrap:anywhere}#runs button.active{background:#e3efff;border-color:#357bd1}.content{padding:24px;min-width:0}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.toolbar label{margin:0 0 6px}.toolbar .baseline{flex:1;min-width:180px}.margin{width:110px}#status{color:#52647a;margin:12px 0}iframe{width:100%;height:75vh;border:1px solid #dce3ec;border-radius:10px;background:white}#empty{padding:30px;background:white;border-radius:10px}#count{color:#63758c;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr}aside{border:0}#runs{max-height:180px}.content{padding:14px}header{padding:18px}iframe{height:80vh}}
</style>
<header><h1>rbench <small>/ отчёты</small></h1><span>Локальные эксперименты</span></header>
<main><aside><button id="refresh">Обновить список</button><label for="search">Поиск экспериментов</label><input id="search" type="search" placeholder="Например, forma"><p id="count"></p><button id="all">Все запуски</button><ul id="runs"></ul></aside>
<section class="content"><div id="live" role="status" aria-live="polite" hidden><strong id="live-text"></strong><progress id="progress" style="width:100%;margin:12px 0" max="1" value="0"></progress></div><h2 id="heading">Общий отчёт</h2><div class="toolbar"><div class="baseline"><label for="baseline">Сравнить с baseline</label><select id="baseline"><option value="">Автоматическое сравнение</option></select></div><div class="margin"><label for="threshold">Порог, %</label><input id="threshold" type="number" value="5" min="0" max="100" step="0.5"></div><button id="build">Построить</button><a class="action" id="open" target="_blank" rel="noopener" hidden>Открыть</a><a class="action" id="json" download="report.json" hidden>JSON</a><a class="action" id="md" download="report.md" hidden>Markdown</a></div><p id="status" role="status" aria-live="polite"></p><div id="empty">Выберите запуск или постройте общий отчёт. Измерения повторно не запускаются.</div><iframe id="viewer" title="Отчёт эксперимента" hidden sandbox="allow-scripts allow-same-origin allow-modals"></iframe></section></main>
<script>
const $=id=>document.getElementById(id);let runs=[],selected=null,version=0;
function list(){const q=$('search').value.toLowerCase();$('runs').replaceChildren();const visible=runs.filter(r=>r.label.toLowerCase().includes(q));$('count').textContent=`${visible.length} из ${runs.length} запусков`;for(const r of visible){const li=document.createElement('li'),b=document.createElement('button');b.textContent=r.label+(r.available?'':' · незавершён');b.classList.toggle('active',selected===r.id);b.onclick=()=>{selected=r.id;$('heading').textContent=r.label;$('baseline').disabled=false;list();build()};li.append(b);$('runs').append(li)}}
async function refresh(){version++;$('status').textContent='Загрузка списка…';try{const res=await fetch('api/runs');if(!res.ok)throw Error(await res.text());runs=await res.json();selected=null;$('heading').textContent='Общий отчёт';$('baseline').replaceChildren(new Option('Автоматическое сравнение',''));for(const r of runs)$('baseline').add(new Option(r.label,r.id));$('baseline').disabled=true;list();$('viewer').hidden=true;$('empty').hidden=false;for(const id of ['open','json','md'])$(id).hidden=true;$('status').textContent='Список обновлён'}catch(e){$('status').textContent=e.message}}
async function build(){const current=++version;const value=$('threshold').value;if(value===''||!$('threshold').checkValidity()){$('status').textContent='Укажите порог от 0 до 100%';return}const p=new URLSearchParams({threshold:value});if(selected!==null)p.set('id',selected);if(selected!==null&&$('baseline').value!=='')p.set('baseline',$('baseline').value);$('status').textContent='Построение отчёта…';$('viewer').hidden=true;for(const id of ['open','json','md'])$(id).hidden=true;try{const url='report?'+p;const res=await fetch(url);if(!res.ok)throw Error(await res.text());const html=await res.text();if(current!==version)return;$('viewer').srcdoc=html;$('viewer').hidden=false;$('empty').hidden=true;$('open').href=url;$('json').href=url+'&format=json';$('md').href=url+'&format=md';for(const id of ['open','json','md'])$(id).hidden=false;$('status').textContent='Отчёт готов. Отсутствие сравнения не означает успешную проверку.'}catch(e){if(current===version)$('status').textContent=e.message}}
$('search').oninput=list;$('refresh').onclick=refresh;$('build').onclick=build;$('all').onclick=()=>{selected=null;$('heading').textContent='Общий отчёт';$('baseline').disabled=true;list();build()};refresh();
let finished=false;
async function watch(){try{const response=await fetch('api/live');if(!response.ok)throw Error('status unavailable');const state=await response.json();const active=['running','preparing'].includes(state.state);$('live').hidden=state.state==='idle';if(active){$('live-text').textContent=state.state==='preparing'?'Подготовка бенчмарка…':`Выполнено ${state.completed} из ${state.total} процессов · ${state.variant||''}`;$('progress').max=state.total||1;$('progress').value=state.completed||0;$('build').disabled=true;$('all').disabled=true;$('baseline').disabled=true;}else if(['complete','failed','cancelled'].includes(state.state)){if(!finished){finished=true;$('build').disabled=false;$('all').disabled=false;$('live-text').textContent=state.state==='complete'?'Бенчмарк завершён. Результаты сохранены.':`Бенчмарк ${state.state==='failed'?'завершился с ошибкой':'отменён'}. Частичные результаты сохранены.`;$('progress').hidden=true;await refresh();await build();}return;}}catch(e){$('live-text').textContent='Связь с runner потеряна. Сохранённые результаты можно открыть через rbench serve.';}setTimeout(watch,1500)}watch();
</script></html>
