[package]
name = "cargo-rbench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Local benchmark runner, Forma importer and offline reports"
keywords = ["benchmark", "cargo-subcommand", "performance", "profiling"]
categories = ["development-tools::profiling", "command-line-utilities"]

[dependencies]
rbench = { path = "../rbench", version = "0.1.0", features = ["memory"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
