<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rbench · Performance report</title>
<style>
:root{color-scheme:light;--ink:#192b35;--muted:#62717b;--border:#dce5e8;--accent:#09695d}*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{background:#163e39;color:white;padding:24px max(24px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:25px;letter-spacing:-1px}header span{opacity:.75;font-size:13px}main{max-width:1328px;margin:auto;padding:32px 24px 64px}h1{font-size:28px;letter-spacing:-.7px;overflow-wrap:anywhere}p{color:var(--muted);max-width:100ch}nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}input{padding:12px 16px;border:1px solid var(--border);border-radius:8px;font:inherit;width:min(100%,440px)}button{font:inherit;cursor:pointer;color:inherit}nav button{border:1px solid var(--border);padding:10px 16px;background:white;border-radius:8px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:white;margin:24px 0}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#e8efed;color:#34574e;white-space:nowrap}th button{font-weight:650;text-align:left;width:100%;padding:15px 16px;border:0;background:none}th button:focus-visible{outline:2px solid var(--accent)}td{padding:14px 16px;border-top:1px solid #edf0f1;vertical-align:top;font-variant-numeric:tabular-nums;min-width:100px}tbody tr:hover{background:#f4faf8}td:first-child{font-weight:600;min-width:260px}details{margin:12px 0;padding:14px 18px;background:white;border:1px solid var(--border);border-radius:8px}summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(140px,1fr) 4fr;gap:8px 20px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}footer{margin-top:32px;font-size:12px;color:var(--muted)}@media print{header,nav{display:none}body{background:white}main{padding:0}.table-wrap{overflow:visible}table{font-size:10px}td,th button{padding:5px}details{break-inside:avoid}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}.card{background:white;padding:16px;border:1px solid var(--border);border-radius:10px}.card strong{display:block;font-size:30px}.card span{font-size:12px;overflow-wrap:anywhere}.regression{border-top:4px solid #bb3939}.error,.unavailable{border-top:4px solid #bd7616}.inconclusive{border-top:4px solid #8d74b3}.passed_comparison{border-top:4px solid #09695d}.run-card{scroll-margin-top:20px;padding:24px;background:#fff;border:1px solid var(--border);border-radius:12px;margin:20px 0}.run-card h2{overflow-wrap:anywhere}.run-card small{font-size:12px;color:var(--muted)}a{color:var(--accent)}select{font:inherit;padding:10px;border:1px solid var(--border);border-radius:8px;background:white}.issue{color:#943b21} [hidden]{display:none!important}
</style></head><body><header><strong>rbench</strong><span>Local evidence · Offline report</span></header><main><nav aria-label="Report tools"><input id="search" type="search" aria-label="Filter measurement rows" placeholder="Filter cases, metrics, variants…"><span id="count" aria-live="polite"></span><button id="print" type="button">Print / PDF</button></nav><nav id="collection-tools" hidden aria-label="Experiment tools"><label>Outcome <select id="outcome"><option value="">All outcomes</option><option value="regression">Regression</option><option value="error">Report or run error</option><option value="unavailable">Metric unavailable</option><option value="inconclusive">Inconclusive</option><option value="uncompared">No comparison</option><option value="diagnostic">Profiler run</option><option value="passed_comparison">Comparison passed</option></select></label><button id="expand" type="button">Expand details</button><button id="collapse" type="button">Collapse details</button></nav><!--CONTENT--><!--CHARTS--><!--DETAILS--><footer>Sort by selecting a column. Observation summaries do not establish statistical significance. Original raw data remains in run.json.</footer></main>
<script type="text/javascript">
'use strict';
const input=document.getElementById('search');
const outcome=document.getElementById('outcome');
function filter(){document.querySelectorAll('article[data-outcome]').forEach(article=>{article.hidden=(outcome.value!==''&&article.dataset.outcome!==outcome.value)||!article.textContent.toLowerCase().includes(input.value.toLowerCase());});let visible=0,total=0;document.querySelectorAll('tbody tr').forEach(row=>{total++;row.hidden=!!row.closest('article[hidden]')||!row.textContent.toLowerCase().includes(input.value.toLowerCase())||(row.dataset.outcome&&outcome.value!==''&&row.dataset.outcome!==outcome.value);if(!row.hidden)visible++;});document.getElementById('count').textContent=visible+' / '+total+' rows';}
document.querySelectorAll('a[href^="#run-"]').forEach(a=>a.addEventListener('click',()=>{input.value='';outcome.value='';filter();}));
input.addEventListener('input',filter);outcome.addEventListener('change',filter);document.getElementById('collection-tools').hidden=!document.querySelector('article[data-outcome]');document.getElementById('expand').addEventListener('click',()=>document.querySelectorAll('article:not([hidden]) details').forEach(d=>d.open=true));document.getElementById('collapse').addEventListener('click',()=>document.querySelectorAll('details').forEach(d=>d.open=false));filter();
document.getElementById('print').addEventListener('click',()=>{const closed=Array.from(document.querySelectorAll('details:not([open])')).filter(d=>!d.closest('article[hidden]'));closed.forEach(d=>d.open=true);try{window.print();}finally{closed.forEach(d=>d.open=false);}});
document.querySelectorAll('th button').forEach(button=>button.addEventListener('click',()=>{const th=button.parentElement,table=th.closest('table'),index=Array.from(th.parentElement.children).indexOf(th),asc=th.getAttribute('aria-sort')!=='ascending';table.querySelectorAll('th').forEach(h=>h.removeAttribute('aria-sort'));th.setAttribute('aria-sort',asc?'ascending':'descending');const rows=Array.from(table.tBodies[0].rows);rows.sort((a,b)=>{const x=a.cells[index].textContent,y=b.cells[index].textContent;const numeric=x.trim()!==''&&y.trim()!==''&&Number.isFinite(Number(x))&&Number.isFinite(Number(y));return (asc?1:-1)*(numeric?Number(x)-Number(y):x.localeCompare(y));});rows.forEach(row=>table.tBodies[0].appendChild(row));}));
</script></body></html>
