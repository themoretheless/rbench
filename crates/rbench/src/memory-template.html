<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rbench · Память</title><style>body{font:15px system-ui;color:#233147;background:#f4f6fa;margin:24px}h1{font-size:25px}select,input,button{padding:10px;border:1px solid #bccbdf;border-radius:7px;background:white}#graph{background:white;padding:12px;overflow:auto;margin:18px 0}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;border-bottom:1px solid #e0e5ec;text-align:left}td:first-child{overflow-wrap:anywhere}#warning{color:#a24411}svg text{font:11px system-ui;pointer-events:none}#details{white-space:pre-wrap;overflow-wrap:anywhere}#summary{font-size:18px}small{color:#64748b}</style><h1>Память · профиль стеков</h1><p id="summary"></p><p id="warning"></p><label>Метрика <select id="metric"><option value="allocated_bytes">Выделено байт</option><option value="allocations">Количество выделений</option><option value="live_bytes">Живые байты в конце</option><option value="live_blocks">Живые блоки в конце</option></select></label> <input id="search" placeholder="Поиск по стеку" aria-label="Поиск по стеку"> <button id="reset">Весь граф</button><p><small>Нажмите на блок, чтобы приблизить ветку. Таблица показывает суммы по полным стекам.</small></p><div id="graph"></div><table><thead><tr><th>Место выделения</th><th>Значение</th></tr></thead><tbody id="rows"></tbody></table><pre id="details"></pre><p id="scope"></p><script id="data" type="application/json">__PROFILE__</script><script>
const p=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let focus=[];
$('scope').textContent=p.scope;$('warning').textContent=p.dropped_events?`Неполный профиль: потеряно ${p.dropped_events} событий. Все суммы и остатки относятся только к записанным событиям.`:'Профиль ограничен выбранным интервалом; живые блоки не обязательно являются утечкой.';
$('summary').textContent=`${p.events} событий · пик отслеживаемой памяти ${p.peak_tracked_bytes.toLocaleString()} байт`;
function draw(){const metric=$('metric').value,q=$('search').value.toLowerCase();const sites=p.sites.filter(s=>s.frames.some(f=>f.toLowerCase().includes(q))&&focus.every((f,i)=>s.frames[i]===f));const root={name:'Все стеки',value:0,children:new Map(),path:focus};for(const s of sites){const value=s[metric];if(!value)continue;root.value+=value;let n=root;for(let i=focus.length;i<s.frames.length;i++){const name=s.frames[i];if(!n.children.has(name))n.children.set(name,{name,value:0,children:new Map(),path:s.frames.slice(0,i+1)});n=n.children.get(name);n.value+=value}}$('graph').replaceChildren();const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1200 650');svg.style.width='100%';svg.style.minWidth='600px';let max=0;function block(n,x,y,w){if(w<1)return;max=Math.max(max,y);const g=document.createElementNS(ns,'g'),r=document.createElementNS(ns,'rect'),t=document.createElementNS(ns,'text'),title=document.createElementNS(ns,'title');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',Math.max(0,w-1));r.setAttribute('height',23);r.setAttribute('fill',`hsl(${20+(y/25*17)%60} 82% 72%)`);title.textContent=`${n.name}: ${n.value.toLocaleString()}`;t.setAttribute('x',x+4);t.setAttribute('y',y+16);t.textContent=w>30?n.name.slice(0,Math.max(1,Math.floor(w/7)-2)):'';g.append(r,title,t);g.style.cursor='pointer';g.onclick=()=>{focus=n.path;draw()};svg.append(g);let at=x;for(const child of n.children.values()){const width=w*child.value/n.value;block(child,at,y+25,width);at+=width}}if(root.value){block(root,0,0,1200);svg.setAttribute('viewBox',`0 0 1200 ${max+25}`);$('graph').append(svg)}else $('graph').textContent='Нет данных для выбранной метрики и фильтра';$('rows').replaceChildren();for(const s of sites.sort((a,b)=>b[metric]-a[metric]).slice(0,100)){const tr=document.createElement('tr'),name=document.createElement('td'),value=document.createElement('td'),button=document.createElement('button');button.textContent=s.frames.slice().reverse().find(f=>!f.includes('rbench::memory')&&!f.includes('backtrace::'))||s.frames.at(-1)||'Неизвестно';button.onclick=()=>{$('details').textContent=s.frames.join('\n')};name.append(button);value.textContent=s[metric].toLocaleString();tr.append(name,value);$('rows').append(tr)}}$('metric').onchange=()=>{focus=[];draw()};$('search').oninput=()=>{focus=[];draw()};$('reset').onclick=()=>{focus=[];draw()};draw();
</script></html>
