[package]
name = "rbench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Explicit, reproducible Rust benchmarks and scenario observations"

[features]
default = []
memory = ["dep:backtrace"]
macros = ["dep:rbench-macros"]

[dependencies]
backtrace = { version = "=0.3.76", optional = true }
rbench-macros = { path = "../rbench-macros", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.rbench]
targets = ["workloads"]

[[bench]]
name = "workloads"
harness = false

[[example]]
name = "memory"
required-features = ["memory"]

# Ensure libc is always linked on Unix for process metrics (explicit cfg table above).
