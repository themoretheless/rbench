name: Release

# Version-driven release via the org-wide reusable workflow.
#
# To cut a release: bump the version in [workspace.package] of Cargo.toml and
# merge to main. The shared workflow detects the version change, runs Clippy and
# tests, then creates the v<version> tag and a GitHub Release with generated
# notes. No secrets or crates.io token required (uses the built-in GITHUB_TOKEN).
#
# rustfmt is skipped (run_fmt: false): this repo is intentionally not
# rustfmt-formatted. package_name selects the library from the multi-crate
# workspace so the tag tracks rbench's version.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: themoretheless/.github/.github/workflows/release-rust-library.yml@d66cd190a0d7a8b45f909dfa97597be34ec93f1f
    with:
      package_name: rbench
      rust_toolchain: stable
      run_fmt: false
