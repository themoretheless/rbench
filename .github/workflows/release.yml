name: Release

# Publishes the crates to crates.io when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN holding a crates.io
# API token with publish scope (Settings → Secrets and variables → Actions).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="rbench"))')"
          echo "tag=$tag crate=$crate"
          test "$tag" = "$crate"
      # Publish in dependency order. Recent cargo waits for each crate to be
      # available on the index before returning, so the next publish resolves.
      - name: Publish rbench-macros
        run: cargo publish -p rbench-macros --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish rbench
        run: cargo publish -p rbench --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish cargo-rbench
        run: cargo publish -p cargo-rbench --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
