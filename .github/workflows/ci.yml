name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test and lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@d66cd190a0d7a8b45f909dfa97597be34ec93f1f
        with:
          rust-toolchain: stable
          components: clippy
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Check MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@d66cd190a0d7a8b45f909dfa97597be34ec93f1f
        with:
          rust-toolchain: "1.85.0"
      - name: Build with the declared minimum supported Rust version
        run: cargo build --workspace --all-targets --locked

  package:
    name: Verify library packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: themoretheless/.github/.github/actions/setup-rust@d66cd190a0d7a8b45f909dfa97597be34ec93f1f
      - name: Package rbench-macros
        run: cargo package -p rbench-macros --locked
