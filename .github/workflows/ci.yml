name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test and lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the shared Rust checks
        uses: ./.github/actions/rust-checks
        with:
          toolchain: stable
          components: clippy

  msrv:
    name: Check MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the declared minimum supported Rust version
        uses: ./.github/actions/rust-checks
        with:
          toolchain: "1.85.0"
          test: "false"
          clippy: "false"

  package:
    name: Verify library packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Sanity-check that the leaf crate's manifest packages cleanly. It has no
      # internal dependencies, so it verifies standalone (rbench / cargo-rbench
      # are covered by the build+test job above).
      - name: Package rbench-macros
        run: cargo package -p rbench-macros --locked
